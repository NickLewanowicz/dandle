android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 dual-mode: KSP/Room + KGP still need the classic Kotlin/DSL path, so we opt out of
# AGP built-in Kotlin and the new AGP DSL (both flags are AGP-sanctioned bypasses; revisit when
# KSP ships built-in-Kotlin support).
android.builtInKotlin=false
android.newDsl=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
