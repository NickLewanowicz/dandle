<!doctype html><html><body style="background:#e8e8ee;color:#222;font-family:sans-serif;padding:24px">
<h2>Launcher candidates (48px launcher size · 96px · full)</h2>
<div id="g" style="display:flex;gap:28px;flex-wrap:wrap"></div>
<script>
const names = ["launcher-candidate-1","launcher-candidate-2","launcher-candidate-3","launcher-candidate-4"];
const g = document.getElementById("g");
for (const n of names) {
  const d = document.createElement("div");
  d.innerHTML = `<div style="text-align:center"><img src="${n}.png" style="width:48px;height:48px;border-radius:12px"><img src="${n}.png" style="width:96px;height:96px;border-radius:22px"><br><b>${n}</b><br><img src="${n}.png" style="width:220px;height:220px"></div>`;
  g.appendChild(d);
}
</script></body></html>
