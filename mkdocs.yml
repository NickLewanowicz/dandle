# =============================================================================
# babybuddy-next documentation site — MkDocs + Material for MkDocs
#
# Structure (persona-reviewed 2026-10-20): a small PARENT surface in front
# (Home / Get the app / Guide / About) and ALL contributor + AI-agent
# machinery under one clearly-labeled "Build docs" tab. Content is not
# deleted — it is housed.
#
# Local preview (from repo root):
#   python3 -m venv .venv
#   .venv/bin/pip install -r requirements-docs.txt
#   .venv/bin/mkdocs serve        # live-reload preview on http://127.0.0.1:8000
#   .venv/bin/mkdocs build --strict   # static site -> site/ (gitignored)
#
# CI: .github/workflows/deploy-docs.yml builds site/ and publishes it to
# GitHub Pages on every push to main that touches docs.
#
# Cloudflare Pages alternative (no workflow file needed):
#   Build command:      pip install -r requirements-docs.txt && mkdocs build --strict
#   Build output dir:   site
#   (Python 3.13+ runtime; no extra environment variables required.)
# =============================================================================

site_name: Baby Buddy Next
site_description: >-
  An offline-first Android client for Baby Buddy — log feeds, diapers, sleep,
  and more, even with no signal. Docs for parents and for contributors.
site_url: ""  # set once the repo is public (enables social cards too)
copyright: Baby Buddy Next — an open-source Baby Buddy client

# The repo root (README.md, AGENTS.md) intentionally stays outside docs_dir;
# docs/index.md is the site's landing page.
docs_dir: docs

# No remote yet: no repo_url / edit_uri, so no edit buttons are rendered.
edit_uri: ""

# Fail the build on broken links, bad nav entries, etc.
strict: true

theme:
  name: material
  favicon: assets/images/favicon.png
  # Match the app's Material 3 shell: indigo-forward in both schemes.
  palette:
    # Auto: follow the OS preference until the visitor toggles manually.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/baby-face-outline
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Click-to-zoom on every screenshot — the flows set is the site's evidence;
  # being able to inspect it full-screen is the premium touch.
  # v0.5.2 stripped every <img> from built pages (caught by the post-build
  # <img> smoke check in deploy-docs.yml); 0.4.0 verified clean.
  - glightbox

# Keep raw icon-iteration HTML sheets (design working files, not documentation)
# out of the published site. Grep confirmed no docs page links them.
# Trade-off: docs/screenshots/ still ships whole (~132 MB) because the
# screenshots are the project's evidence-of-record; revisit if Pages deploys get slow.
exclude_docs: |
  design/candidates/icon-round2/*.html

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      # Mermaid (queue-state + data-flow diagrams) renders natively in Material.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Hand-crafted nav: every markdown file under docs/ is reachable from here
# (strict mode flags any that are not). Do not let this drift — new docs
# files must be added to the right group.
#
# Audience split (persona-reviewed): everything a parent needs sits in the
# first four tabs; the workshop lives under "Build docs".
nav:
  - Home: index.md
  - Get the app: get-the-app.md
  - Guide:
      - Logging a feed, diaper, or nap: guide/logging.md
      - Timers, and fixing a time: guide/timers-and-editing.md
      - No signal? Keep logging: guide/offline.md
      - Widgets: guide/widgets.md
      - Your data & security: guide/data-and-privacy.md
  - About: about.md
  - Build docs:
      - Build docs home: build-docs.md
      - The rewrite contract:
          - Functional spec: flows/new-app/00-functional-spec.md
          - UI shell spec: flows/new-app/01-ux-spec.md
      - Flow verification (QA):
          - Login: flows/new-app/10-login.md
          - Quick actions: flows/new-app/20-quick-actions.md
          - Timeline & quick edit: flows/new-app/30-timeline-and-edit.md
          - Offline & sync: flows/new-app/40-offline-sync.md
          - Widgets: flows/new-app/50-widgets.md
          - Help & about: flows/new-app/60-help-about.md
          - Widget QA reference: flows/new-app/widgets.md
      - Design & history:
          - Owner UI rework: flows/new-app/90-owner-ui-rework.md
          - Widget UX review: flows/new-app/70-widget-ux-review.md
          - User persona review: flows/new-app/02-user-persona-review.md
          - Icon design: design/icons.md
          - Persona feedback (round 1):
              - Plan: flows/new-app/80-persona-feedback/00-plan.md
              - Triage: flows/new-app/80-persona-feedback/00-triage.md
              - Elena: flows/new-app/80-persona-feedback/elena.md
              - Jordan: flows/new-app/80-persona-feedback/jordan.md
              - Priya: flows/new-app/80-persona-feedback/priya.md
              - Sam: flows/new-app/80-persona-feedback/sam.md
      - QA:
          - QA runbook: qa/RUNBOOK.md
          - Feature checklists: qa/FEATURE-CHECKLISTS.md
          - QA overview: qa/README.md
          - QA findings: flows/new-app/99-qa-findings.md
      - Research:
          - Baby Buddy API: research/babybuddy-api.md
          - Existing app architecture: research/existing-app-architecture.md
      - Original app reference:
          - Overview: flows/existing-app/00-overview.md
          - Login: flows/existing-app/01-login.md
          - Dashboard: flows/existing-app/02-dashboard.md
          - Sleep: flows/existing-app/03-sleep.md
          - Feeding: flows/existing-app/04-feeding.md
          - Diaper: flows/existing-app/05-diaper.md
          - Notes: flows/existing-app/06-note.md
          - Pumping: flows/existing-app/07-pumping.md
