# Builds the Docusaurus docs site and runs the media smoke check.
# Local equivalent: cd website && npm ci && npm run build   (output: website/build)
#
# History: this repo lived on GitHub briefly and deployed to GitHub Pages
# (actions/upload-pages-artifact + deploy-pages). Those actions are GitHub
# services that cannot work on the self-hosted Gitea runner — every run died
# at "Upload Pages artifact" while build+verify were green (2026-10-31).
# Publishing is done from the laptop: website/ builds clean, deploy target is
# manual (Cloudflare Pages alternative: build command `cd website && npm ci
# && npm run build`, output dir `website/build` — no workflow needed).

name: Docs build check

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: website

      - name: Build site
        run: npm run build -- --out-dir ../site
        working-directory: website

      # Post-build smoke check: a plugin regression once stripped every <img>
      # from the built pages while the build stayed green (2026-10-20, the
      # MkDocs era). The screenshots ARE the documentation — a deploy without
      # them is a lie.
      - name: Verify media survived the build
        run: |
          count=$(grep -rl '<img' site --include='*.html' | wc -l)
          echo "pages with <img>: $count"
          test "$count" -ge 10
          test -f site/media/demo-offline.gif
          test -f site/img/favicon.png
          # Every <img> src must resolve to a real file in the build output.
          python3 - <<'PY'
          import re, os, glob, sys
          missing = []
          for page in glob.glob('site/**/*.html', recursive=True):
              html = open(page, encoding='utf-8').read()
              for src in re.findall(r'<img[^>]*\ssrc="([^"]+)"', html):
                  path = src.split('?')[0].split('#')[0]
                  if path.startswith('http'):
                      continue
                  if not os.path.isfile(os.path.join('site', path.lstrip('/'))):
                      missing.append((page, src))
          if missing:
              for page, src in missing:
                  print(f"BROKEN IMG: {src} on {page}")
                  sys.exit(1)
          print("all <img> srcs resolve")
          PY
